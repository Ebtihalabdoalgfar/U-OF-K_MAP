<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>خريطة جامعة الخرطوم — مجمع الوسط</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1923;
      --panel:     #162030;
      --border:    #1e3048;
      --accent:    #3b82f6;
      --accent2:   #60a5fa;
      --text:      #e2eaf4;
      --muted:     #7a99bb;
      --faculty:   rgba(59,130,246,0.22);
      --faculty-b: #3b82f6;
      --admin:     rgba(16,185,129,0.18);
      --admin-b:   #10b981;
      --ground:    rgba(251,191,36,0.12);
      --ground-b:  #fbbf24;
      --frame:     rgba(255,255,255,0.04);
      --frame-b:   rgba(255,255,255,0.15);
    }

    html, body { height: 100%; font-family: 'IBM Plex Sans Arabic', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Layout ── */
    .shell { display: flex; flex-direction: column; height: 100vh; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 56px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      flex-shrink: 0; gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--accent); display: grid; place-items: center;
      font-size: 16px; flex-shrink: 0;
    }
    .logo-text { line-height: 1.2; }
    .logo-text strong { font-size: 14px; font-weight: 600; display: block; }
    .logo-text span   { font-size: 11px; color: var(--muted); display: block; }

    .search-wrap { position: relative; flex: 1; max-width: 320px; }
    .search-wrap input {
      width: 100%; padding: 8px 36px 8px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px;
      font-family: inherit; outline: none; transition: border .2s;
      direction: rtl;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 14px; pointer-events: none;
    }
    .search-results {
      position: absolute; top: calc(100% + 6px); right: 0; left: 0;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; z-index: 1000;
      display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .search-results.open { display: block; }
    .search-result-item {
      padding: 10px 14px; cursor: pointer; font-size: 13px;
      border-bottom: 1px solid var(--border); transition: background .15s;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--border); }
    .search-result-item .en { color: var(--muted); font-size: 11px; margin-top: 2px; }

    /* ── Map ── */
    #map { flex: 1; }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
      color: var(--text); padding: 0;
    }
    .leaflet-popup-tip { background: var(--panel); }
    .leaflet-popup-content { margin: 0; }
    .popup-inner { padding: 14px 16px; min-width: 160px; }
    .popup-inner h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .popup-inner p  { font-size: 12px; color: var(--muted); direction: ltr; text-align: left; }
    .popup-badge {
      display: inline-block; margin-top: 8px;
      padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
    }
    .badge-faculty { background: rgba(59,130,246,.2); color: #60a5fa; }
    .badge-admin   { background: rgba(16,185,129,.2); color: #34d399; }
    .badge-ground  { background: rgba(251,191,36,.15); color: #fbbf24; }
    .badge-frame   { background: rgba(255,255,255,.08); color: #94a3b8; }

    /* ── Legend ── */
    .legend {
      position: absolute; bottom: 20px; left: 16px; z-index: 500;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px; font-size: 12px;
      display: flex; flex-direction: column; gap: 7px;
      box-shadow: 0 4px 16px rgba(0,0,0,.4);
    }
    .legend-title { font-size: 11px; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; flex-shrink: 0; }

    /* hide default Leaflet attribution clutter */
    .leaflet-control-attribution { display: none; }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">
      <div class="logo-mark">🗺</div>
      <div class="logo-text">
        <strong>جامعة الخرطوم</strong>
        <span>University of Khartoum — Central Campus</span>
      </div>
    </div>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="ابحث عن كلية أو مبنى…" autocomplete="off"/>
      <span class="search-icon">🔍</span>
      <div class="search-results" id="searchResults"></div>
    </div>
  </header>

  <div id="map"></div>

  <div class="legend">
    <div class="legend-title">المفتاح</div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:rgba(59,130,246,0.22);border-color:#3b82f6"></div>
      <span>كلية</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:rgba(16,185,129,0.18);border-color:#10b981"></div>
      <span>مبنى إداري</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background:rgba(251,191,36,0.12);border-color:#fbbf24"></div>
      <span>ميدان / مساحة</span>
    </div>
  </div>

</div>

<script>

  },

  },

    },

  },

  }
];

const campusFrame = {
  coordinates: [[[32.54464234457259,15.6101701623685],[32.54441174630696,15.61174480394368],[32.54417531774597,15.61185928856307],[32.54389372375637,15.61268705459484],[32.53841663590595,15.61166175707129],[32.53879450874389,15.60924737014362],[32.54464234457259,15.6101701623685]]]
};

// ── Style helpers ─────────────────────────────────────────────────────────────
function styleFor(type) {
  const s = {
    faculty: { color:"#3b82f6", fillColor:"#3b82f6", fillOpacity:.2, weight:1.5 },
    admin:   { color:"#10b981", fillColor:"#10b981", fillOpacity:.18, weight:1.5 },
    ground:  { color:"#fbbf24", fillColor:"#fbbf24", fillOpacity:.12, weight:1.2 },
  };
  return s[type] || s.faculty;
}

function badgeFor(type) {
  const b = { faculty:"badge-faculty", admin:"badge-admin", ground:"badge-ground" };
  return b[type] || "badge-faculty";
}
function labelFor(type) {
  const l = { faculty:"كلية", admin:"مبنى إداري", ground:"ميدان" };
  return l[type] || "";
}

// ── GeoJSON converter ─────────────────────────────────────────────────────────
// Our coords are [lng, lat] — Leaflet needs [lat, lng]
function toLatLngs(coords) {
  return coords.map(ring => ring.map(([lng, lat]) => [lat, lng]));
}

// ── Map init ──────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true }).setView([15.6108, 32.5415], 17);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© CartoDB',
  maxZoom: 21
}).addTo(map);

// Campus frame
L.polygon(toLatLngs(campusFrame.coordinates), {
  color: "rgba(255,255,255,0.25)",
  fillColor: "rgba(255,255,255,0)",
  weight: 2,
  dashArray: "6 4"
}).addTo(map);

// Buildings
const layers = [];
buildings.forEach(b => {
  const poly = L.polygon(toLatLngs(b.coordinates), styleFor(b.type))
    .bindPopup(
      <div class="popup-inner">
        <h3>${b.name}</h3>
        <p>${b.nameEn}</p>
        <span class="popup-badge ${badgeFor(b.type)}">${labelFor(b.type)}</span>
      </div>
    , { maxWidth: 240 })
    .addTo(map);

  poly.on('mouseover', function() {
    this.setStyle({ fillOpacity: this.options.fillOpacity + 0.15, weight: 2.5 });
  });
  poly.on('mouseout', function() {
    this.setStyle(styleFor(b.type));
  });

  layers.push({ data: b, layer: poly });
});

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput   = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.classList.remove('open'); return; }

  const hits = layers.filter(l =>
    l.data.name.includes(q) || l.data.nameEn.toLowerCase().includes(q.toLowerCase())
  );

  if (!hits.length) { searchResults.classList.remove('open'); return; }
  hits.forEach(h => {
    const div = document.createElement('div');
    div.className = 'search-result-item';
    div.innerHTML = ${h.data.name}<div class="en">${h.data.nameEn}</div>;
    div.addEventListener('click', () => {
      map.fitBounds(h.layer.getBounds(), { maxZoom: 19 });
      h.layer.openPopup();
      searchInput.value = h.data.name;
      searchResults.classList.remove('open');
    });
    searchResults.appendChild(div);
  });
  searchResults.classList.add('open');
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('open');
});
</script>
